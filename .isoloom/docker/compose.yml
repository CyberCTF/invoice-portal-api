# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: isothrum check . (or: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check, and isoloom-check-<machine>)
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v
# Secrets and inputs, delivered as files: set CTF_LAUNCH_TOKEN for `up` (each value, never in the file).

name: invoice-portal-api
services:
  database:
    build:
      context: ../../build/database
      labels:
        isoloom.managed: 'true'
        isoloom.environment: invoice-portal-api
    image: isoloom/invoice-portal-api-database
    platform: linux/amd64
    hostname: database
    networks:
      lab:
        ipv4_address: 10.20.0.32
    environment:
      CTF_API_URL: ${CTF_API_URL:-}
    volumes:
    - database-evidence:/var/lib/ctf
    - isoloom-probe-amd64:/.isoloom-probe:ro
    secrets:
    - source: input-ctf-launch-token
      target: /run/lab/launch-token
      mode: '0400'
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 3207
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
    labels:
      isoloom.port.mysql: tcp:3207
      isoloom.managed: 'true'
      isoloom.environment: invoice-portal-api
    restart: unless-stopped
  database-init-1:
    image: isoloom/invoice-portal-api-database
    user: root
    entrypoint:
    - /bin/sh
    - /isoloom/init/evidence.sh
    network_mode: service:database
    environment:
      CTF_API_URL: ${CTF_API_URL:-}
    volumes:
    - ../../build/database/evidence.sh:/isoloom/init/evidence.sh:ro
    - database-evidence:/var/lib/ctf
    secrets:
    - source: input-ctf-launch-token
      target: /run/lab/launch-token
      mode: '0400'
    depends_on:
      database:
        condition: service_healthy
    labels:
      isoloom.managed: 'true'
      isoloom.environment: invoice-portal-api
    restart: no
  web:
    build:
      context: ../../build/web
      labels:
        isoloom.managed: 'true'
        isoloom.environment: invoice-portal-api
    image: isoloom/invoice-portal-api-web
    platform: linux/amd64
    hostname: web
    networks:
      lab:
        ipv4_address: 10.20.0.31
    ports:
    - ${ISOLOOM_PUBLISH_ADDRESS:-127.0.0.1}:${ISOLOOM_PUBLISH_FIXED:+80}:80
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 80
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      database-init-1:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
    labels:
      isoloom.port.portal: http:80
      isoloom.managed: 'true'
      isoloom.environment: invoice-portal-api
    restart: unless-stopped
  isoloom-check:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    networks:
      lab: null
    volumes:
    - ./checks/networks.sh:/isoloom/run.sh:ro
    - ../..:/isoloom/project:ro
    depends_on:
      database:
        condition: service_healthy
      database-init-1:
        condition: service_completed_successfully
      web:
        condition: service_healthy
    labels:
      isoloom.managed: 'true'
      isoloom.environment: invoice-portal-api
  isoloom-check-database:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    network_mode: service:database
    volumes:
    - ./checks/database.sh:/isoloom/run.sh:ro
    depends_on:
      database:
        condition: service_healthy
      database-init-1:
        condition: service_completed_successfully
      web:
        condition: service_healthy
    labels:
      isoloom.managed: 'true'
      isoloom.environment: invoice-portal-api
  isoloom-check-web:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    network_mode: service:web
    volumes:
    - ./checks/web.sh:/isoloom/run.sh:ro
    depends_on:
      database:
        condition: service_healthy
      database-init-1:
        condition: service_completed_successfully
      web:
        condition: service_healthy
    labels:
      isoloom.managed: 'true'
      isoloom.environment: invoice-portal-api
  isoloom-probe-amd64:
    image: busybox:1.37.0-musl
    platform: linux/amd64
    entrypoint:
    - /bin/cp
    - /bin/busybox
    - /probe/busybox
    network_mode: none
    volumes:
    - isoloom-probe-amd64:/probe
    labels:
      isoloom.managed: 'true'
      isoloom.environment: invoice-portal-api
    restart: no
networks:
  lab:
    ipam:
      config:
      - subnet: 10.20.0.0/24
        gateway: 10.20.0.1
    labels:
      isoloom.managed: 'true'
      isoloom.environment: invoice-portal-api
volumes:
  database-evidence:
    labels:
      isoloom.managed: 'true'
      isoloom.environment: invoice-portal-api
  isoloom-probe-amd64:
    labels:
      isoloom.managed: 'true'
      isoloom.environment: invoice-portal-api
secrets:
  input-ctf-launch-token:
    environment: CTF_LAUNCH_TOKEN

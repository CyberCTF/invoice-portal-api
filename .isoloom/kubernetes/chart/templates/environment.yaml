# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      isoloom.com/machine: database
  template:
    metadata:
      labels:
        isoloom.com/machine: database
        net.isoloom.com/lab: member
    spec:
      hostname: database
      initContainers:
      - name: isoloom-probe
        image: busybox:1.37.0-musl
        command:
        - /bin/cp
        - /bin/busybox
        - /probe/busybox
        volumeMounts:
        - name: isoloom-probe
          mountPath: /probe
      - name: seed-evidence
        image: '{{ index .Values.images "database" }}'
        imagePullPolicy: IfNotPresent
        command:
        - /.isoloom-probe/busybox
        - sh
        - -c
        - 'd=/isoloom-seed; m="$d/.isoloom-seeding"; b=/.isoloom-probe/busybox; [ -d ''/var/lib/ctf'' ] || exit 0; for f in "$d"/* "$d"/.[!.]* "$d"/..?*; do if [ -e "$f" ] || [ -L "$f" ]; then case "$f" in "$d/lost+found" | "$m") ;; *) [ -e "$m" ] || exit 0; $b rm -rf "$f" ;; esac; fi; done; : > "$m" && $b cp -a ''/var/lib/ctf/.'' "$d/" && $b rm -f "$m"'
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
        - name: vol-evidence
          mountPath: /isoloom-seed
        - name: isoloom-probe
          mountPath: /.isoloom-probe
          readOnly: true
      containers:
      - name: database
        image: '{{ index .Values.images "database" }}'
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3207
        readinessProbe:
          exec:
            command:
            - /.isoloom-probe/busybox
            - sh
            - -c
            - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 3207
          periodSeconds: 5
          failureThreshold: 60
        env:
        - name: CTF_API_URL
          valueFrom:
            secretKeyRef:
              name: isoloom-inputs
              key: CTF_API_URL
              optional: true
        resources:
          limits:
            cpu: '1'
            memory: 1024Mi
        volumeMounts:
        - name: vol-evidence
          mountPath: /var/lib/ctf
        - name: isoloom-probe
          mountPath: /.isoloom-probe
          readOnly: true
        - name: isoloom-secrets
          mountPath: /run/lab/launch-token
          readOnly: true
          subPath: input-ctf-launch-token
      - name: init
        image: '{{ index .Values.images "database" }}'
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - until /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 3207; do sleep 2; done && sh /isoloom/scripts/build__database__evidence.sh && exec sleep infinity
        env:
        - name: CTF_API_URL
          valueFrom:
            secretKeyRef:
              name: isoloom-inputs
              key: CTF_API_URL
              optional: true
        volumeMounts:
        - name: vol-evidence
          mountPath: /var/lib/ctf
        - name: isoloom-probe
          mountPath: /.isoloom-probe
          readOnly: true
        - name: isoloom-secrets
          mountPath: /run/lab/launch-token
          readOnly: true
          subPath: input-ctf-launch-token
        - name: scripts
          mountPath: /isoloom/scripts
      nodeSelector:
        kubernetes.io/arch: amd64
      volumes:
      - name: vol-evidence
        persistentVolumeClaim:
          claimName: database-evidence
      - name: scripts
        configMap:
          name: isoloom-scripts
          defaultMode: 493
      - name: isoloom-probe
        emptyDir: {}
      - name: isoloom-secrets
        secret:
          secretName: isoloom-secrets
          items:
          - key: input-ctf-launch-token
            path: input-ctf-launch-token
            mode: 256
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: database-evidence
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: database
spec:
  selector:
    isoloom.com/machine: database
  ports:
  - name: p3207
    port: 3207
    targetPort: 3207
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      isoloom.com/machine: web
  template:
    metadata:
      labels:
        isoloom.com/machine: web
        net.isoloom.com/lab: member
    spec:
      hostname: web
      initContainers:
      - name: isoloom-probe

# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Supplier portal API: Globex Finance's read-only supplier API. One description, run on every
# target: containers (Docker), or one VM per machine (Vagrant, ESXi, Proxmox), or Docker on one
# VM (this machine, a server, any cloud). The launch token reaches the database as a file, never
# as an environment variable; the API's URL isn't secret, so it is one. See https://www.isoloom.com.
version: 1
name: invoice-portal-api

networks:
  lab: {cidr: 10.20.0.0/24}

# Given by the CyberCTF launcher so the database claims this player's evidence (the amount of
# invoice INV-20507). The launch token is single-use and secret, so it arrives as a file; the
# API's URL isn't secret, so it may be an environment value. Without them (local runs, CI) the
# lab uses its development evidence.
inputs:
  CTF_API_URL: {sensitive: false, description: "The CyberCTF API the database claims evidence from."}
  CTF_LAUNCH_TOKEN: {description: "A single-use token issued at launch; the database claims this player's evidence with it."}

machines:
  database:
    os: debian@12
    networks: {lab: 32}
    ports: {mysql: 3207}
    resources: {cpus: 1, memory_mb: 1024}
    environment:
      CTF_API_URL: {input: CTF_API_URL}
    files:
      - {path: /run/lab/launch-token, input: CTF_LAUNCH_TOKEN}
    # The claimed evidence: the launch token is single-use, so it must survive restarts.
    volumes: {evidence: /var/lib/ctf}
    app:
      build: build/database
      steps: [run: provision/database.sh]
    # Once the database answers: claim this player's evidence (reads the token file above) and
    # place it as the amount of invoice INV-20507. Nothing on the command line or in the env.
    setup: [build/database/evidence.sh]

  web:
    os: debian@12
    networks: {lab: 31}
    ports:
      portal: {port: 80, protocol: http, publish: 80}
    depends_on: [database]
    resources: {cpus: 1, memory_mb: 1024}
    app:
      build: build/web
      steps: [run: provision/web.sh]

# From the player's side, on every target: the lesson, declared; the intended path, as a script
# (it needs the documented key). Reachability checks are derived from the spec.
checks:
  - name: the API refuses a request without its key
    http: http://web/api/invoices/INV-20507
    expect: 401
  - build/check/check.sh

# Shown when the lab is up.
message: |
  Globex Finance's supplier portal API answers at {{ machines.web.ports.portal.url }}.
  Start with the documentation it publishes; the invoice you are after is INV-20507.

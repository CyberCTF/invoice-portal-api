services:
  evidence:
    image: curlimages/curl:8.11.1
    user: "0:0"
    entrypoint: ["/bin/sh", "/opt/ctf/claim-evidence.sh"]
    environment:
      CTF_API_URL: ${CTF_API_URL:-}
      CTF_LAUNCH_TOKEN: ${CTF_LAUNCH_TOKEN:-}
      CTF_DEV_EVIDENCE: "15600.00"
    volumes:
      - ./evidence/claim-evidence.sh:/opt/ctf/claim-evidence.sh:ro
      - ctf-evidence:/run/ctf

  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "root-pass-9f2c"
      MYSQL_DATABASE: "portal"
      MYSQL_USER: "portal"
      MYSQL_PASSWORD: "portal-pass"
      MYSQL_TCP_PORT: "3207"
    # No host port binding: reach it from the attack box at database:3207 on the lab network.
    volumes:
      - ./build/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "3207", "-uroot", "-proot-pass-9f2c"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  place-evidence:
    image: mysql:8.0
    depends_on:
      database:
        condition: service_healthy
      evidence:
        condition: service_completed_successfully
    environment:
      DB_HOST: "database"
      DB_PORT: "3207"
      MYSQL_ROOT_PASSWORD: "root-pass-9f2c"
      DB_NAME: "portal"
    entrypoint: ["/bin/sh", "/opt/ctf/place-evidence.sh"]
    volumes:
      - ./build/database/place-evidence.sh:/opt/ctf/place-evidence.sh:ro
      - ctf-evidence:/run/ctf:ro

  web:
    build:
      context: ./build/web
      dockerfile: Dockerfile
    image: invoice-portal-api_web
    depends_on:
      database:
        condition: service_healthy
      place-evidence:
        condition: service_completed_successfully
    environment:
      DB_HOST: "database"
      DB_PORT: "3207"
      DB_USER: "portal"
      DB_PASSWORD: "portal-pass"
      DB_NAME: "portal"
      PORTAL_API_KEY: "vendor-demo-key"
    # No host port binding: reach it from the attack box at web:3206 on the lab network.

volumes:
  ctf-evidence:

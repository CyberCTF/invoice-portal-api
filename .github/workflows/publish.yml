name: Register lab
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  register:
    if: hashFiles('.ctf/metadata.json') != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the registration action
        uses: actions/checkout@v4
        with:
          repository: CyberCTF/publish-lab-action
          ref: v1
          path: .publish-lab-action
      - uses: isoloom/isoloom@v0.7.2
      - run: isoloom generate
      - uses: ./.publish-lab-action
        with:
          client_id: ${{ secrets.CYBERAUTH_CLIENT_ID }}
          client_secret: ${{ secrets.CYBERAUTH_CLIENT_SECRET }}
          backend_url: ${{ secrets.CYBERBACKEND_URL }}
          token_url: ${{ secrets.CYBERAUTH_TOKEN_URL }}
